name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commands:
    name: scan and cp on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan the planted secret
        id: scan
        uses: ./
        continue-on-error: true
        with:
          command: scan
          path: test-fixtures/secrets

      - name: Check that the scan failed with findings and a SARIF report
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -x
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2
          test "$FINDINGS" = 2
          jq -e '[.runs[0].results[].ruleId] | sort == ["local-rules/aws-access-key", "local-rules/email"]' "$SARIF_FILE"
          jq -e 'all(.runs[0].results[].locations[0].physicalLocation.artifactLocation;
            .uri == "test-fixtures/secrets/deploy.env" and .uriBaseId == "%SRCROOT%")' "$SARIF_FILE"

      - name: Scan the planted secret without failing
        id: scan-never
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          categories: secrets, contact
          fail-on: never

      - name: Check that the scan passed with the same findings
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan-never.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-never.outputs.findings }}
          CACHE_HIT: ${{ steps.scan-never.outputs.cache-hit }}
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2
          test "$CACHE_HIT" = true
          test -z "$(find "$RUNNER_TEMP/redacter-addons" -maxdepth 1 -name 'credential-line*')"

      - name: Redact the planted secret
        id: cp
        uses: ./
        with:
          command: cp
          path: test-fixtures/secrets
          destination: ${{ runner.temp }}/redacted/

      - name: Check that the copy has no planted value
        shell: bash
        env:
          EXIT_CODE: ${{ steps.cp.outputs.exit-code }}
          FINDINGS: ${{ steps.cp.outputs.findings }}
          SARIF_FILE: ${{ steps.cp.outputs.sarif-file }}
          REDACTED_FILE: ${{ runner.temp }}/redacted/deploy.env
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2
          jq -e '.runs[0].results | length == 2' "$SARIF_FILE"
          grep -q '^AWS_ACCESS_KEY_ID=' "$REDACTED_FILE"
          if grep -e AKIAIOSFODNN7EXAMPLE -e jane.doe@example.com "$REDACTED_FILE"; then
            exit 1
          fi

  block-markers:
    name: block markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan a file with a marked region
        id: scan
        uses: ./
        continue-on-error: true
        with:
          command: scan
          path: test-fixtures/markers

      - name: Check that only the value outside the region is reported
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -x
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2
          test "$FINDINGS" = 1
          jq -e '[.runs[0].results[] | .ruleId, .locations[0].physicalLocation.region.startLine] == ["local-rules/aws-access-key", 6]' "$SARIF_FILE"
          jq -e '.runs[0].invocations[0].toolExecutionNotifications | length == 0' "$SARIF_FILE"

  credential-ml:
    name: local-credential-ml as an opt-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan with local-rules and local-credential-ml
        id: scan
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          redacters: local-rules,local-credential-ml

      - name: Check that the model was installed and the findings are the same
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2
          test -n "$(find "$RUNNER_TEMP/redacter-addons" -maxdepth 1 -name 'credential-line*')"

  other-version:
    name: scan with a version that is not pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan with redacter 0.22.0
        id: scan
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          redacters: local-rules
          version: 0.22.0
          addons: none

      - name: Check that the scan found the planted secret
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2

  cache-input:
    name: cache input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fill the cache
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          redacters: local-rules
          addons: pdf

      - name: Remove the installed addons
        shell: bash
        run: rm -rf "$RUNNER_TEMP/redacter-addons"

      - name: Scan with the cache off
        id: scan
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          redacters: local-rules
          addons: pdf
          cache: false

      - name: Check that the addons were downloaded and not restored
        shell: bash
        env:
          CACHE_HIT: ${{ steps.scan.outputs.cache-hit }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -x
          test -z "$CACHE_HIT"
          test "$FINDINGS" = 2
          test -n "$(ls -A "$RUNNER_TEMP/redacter-addons")"

      - name: Scan with a cache value that is not a boolean
        id: invalid
        uses: ./
        continue-on-error: true
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          redacters: local-rules
          cache: maybe

      - name: Check that the invalid value failed the setup
        shell: bash
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          EXIT_CODE: ${{ steps.invalid.outputs.exit-code }}
        run: |
          set -x
          test "$OUTCOME" = failure
          test -z "$EXIT_CODE"
